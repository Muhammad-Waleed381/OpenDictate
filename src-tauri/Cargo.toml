[package]
name = "opendictate"
version.workspace = true
description = "OpenDictate — local-first voice dictation for your desktop"
authors = ["Muhammad-Waleed381"]
edition.workspace = true
license.workspace = true

[lib]
name = "opendictate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
env_logger = "0.11"
log = "0.4"
rodio = "0.20"
opendictate-core = { path = "../crates/opendictate-core", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
libc = "0.2"

# Cross-platform text injection (SendInput on Windows, CGEvent on macOS) and
# native notifications for the non-Linux builds. Linux keeps its battle-tested
# ydotool/xdotool + notify-send paths.
[target.'cfg(not(target_os = "linux"))'.dependencies]
enigo = "0.2"
notify-rust = "4"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

# Raw HID event stream for double-tap modifier gestures, which Carbon's
# RegisterEventHotKey (behind tauri-plugin-global-shortcut) cannot express.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
# AppKit access for the focus watchdog: it hands the application activation
# back to the user's application when the dock takes it. Both crates are
# already in the tree through Tauri, so this does not add a new dependency.
objc2 = "0.6"
objc2-app-kit = "0.3"

[features]
default = ["cpu-static"]
cpu-static = ["opendictate-core/cpu-static"]
gpu-shared = ["opendictate-core/gpu-shared"]
# Added automatically by `tauri build`. Serves the bundled frontend from the
# embedded assets instead of `devUrl`. It must NOT be enabled on the `tauri`
# dependency directly — that pins it on for `tauri dev` too, so the dev server
# and hot reload are silently bypassed and the app renders the last `dist/`.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
image = "0.25"
