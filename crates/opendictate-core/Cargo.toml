[package]
name = "opendictate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core engine for OpenDictate: capture, VAD, transcription, injection"

[dependencies]
bzip2 = "0.5"
cpal = "0.15"
env_logger = "0.11"
sherpa-onnx = "1.12"
tar = "0.4"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
ureq = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-sys = "1.23.0"

[dev-dependencies]
serde_json = "1"
