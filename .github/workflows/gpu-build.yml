name: CUDA build (dry run)

# Builds the same CUDA installers as the Release workflow (Linux .deb and
# Windows NSIS setup, linked against the CUDA build of sherpa-onnx) without
# publishing anything. Run it on a branch to check the CUDA packaging before
# tagging a release; the installers are attached to the run as artifacts.

on:
  workflow_dispatch:

jobs:
  cuda:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb
            artifact: opendictate-linux-cuda
            path: target/release/bundle/deb/*.deb
          - platform: windows-latest
            bundles: nsis
            artifact: opendictate-windows-cuda
            path: target/release/bundle/nsis/*-setup.exe

    name: cuda (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libpulse-dev libudev-dev libgtk-3-dev pkg-config cmake \
            build-essential bzip2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: cuda

      - run: npm ci

      - name: Stage the CUDA libraries
        uses: ./.github/actions/cuda-libs

      - name: Build
        shell: bash
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --features gpu-shared -- --no-default-features

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.path }}
