name: Release

# Builds signed-free installers for all three platforms on version tags.
# Windows: NSIS .exe + MSI. macOS: universal .dmg/.app. Linux: .deb/.AppImage.
#
# Local cross-compilation is not possible (sherpa-onnx builds C++ per
# platform), so CI is the only place these artifacts are produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A manual run from a branch would publish a release and a tag named after it.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libpulse-dev libudev-dev libgtk-3-dev \
            libfuse2 zsync pkg-config cmake build-essential
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "ARCH=x86_64" >> "$GITHUB_ENV"
          # Pre-cache AppRun with world-executable permissions (0755) to prevent
          # AppRun.wrapped permission errors in unprivileged sandboxes (Firejail, etc.)
          mkdir -p "$HOME/.cache/tauri"
          curl -fL "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" -o "$HOME/.cache/tauri/AppRun-x86_64"
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: "x86_64"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDictate ${{ github.ref_name }}"
          releaseBody: |
            OpenDictate ${{ github.ref_name }} can now install its own updates, and you can choose when the dock is on screen.

            ### Install updates from the app
            - When a newer version is out, "Update now" (in the pop-up) and "Download and install" (in Settings) fetch the right installer for your computer, install it and restart the app.
            - It handles the Windows setup, the macOS app, and Linux AppImage, `.deb` and `.rpm` installs. Each download is checked against the SHA-256 checksum GitHub publishes for it before anything is installed.
            - If your copy can't update itself (for example an MSI install), the button opens the download page as before.
            - Updates are only downloaded when you click. The app still only checks for a new version when it opens, and you can turn that off.
            - On Linux `.deb` and `.rpm` installs you will be asked for your password.

            ### Dock visibility
            - New "Dock visibility" setting: Always (as before), Only while dictating, or Never. It's useful on OLED screens, where a pill that never moves can burn in.
            - The hotkey, the tray icon and notifications still work when the dock is hidden.

            ### Installers
            - Windows: `.msi` / `.exe` (NSIS) installers
            - macOS: universal `.dmg` (Apple Silicon + Intel)
            - Linux: `.deb`, `.rpm` and `.AppImage`

            Models download inside the app on first run. Speech recognition always runs on your own machine.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
