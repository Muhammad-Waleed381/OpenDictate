name: Release

# Builds signed-free installers for all three platforms on version tags.
# Windows: NSIS .exe + MSI. macOS: universal .dmg/.app. Linux: .deb/.AppImage.
#
# Local cross-compilation is not possible (sherpa-onnx builds C++ per
# platform), so CI is the only place these artifacts are produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A manual run from a branch would publish a release and a tag named after it.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libpulse-dev libudev-dev libgtk-3-dev \
            libfuse2 zsync pkg-config cmake build-essential
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "ARCH=x86_64" >> "$GITHUB_ENV"
          # Pre-cache AppRun with world-executable permissions (0755) to prevent
          # AppRun.wrapped permission errors in unprivileged sandboxes (Firejail, etc.)
          mkdir -p "$HOME/.cache/tauri"
          curl -fL "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" -o "$HOME/.cache/tauri/AppRun-x86_64"
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: "x86_64"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDictate ${{ github.ref_name }}"
          releaseBody: |
            OpenDictate ${{ github.ref_name }} is a big one: a new look, faster transcription, an update check, history search, and a long list of fixes to hands-free mode and voice commands.

            ### New look
            - A violet and pink theme, with a solid dark mode. In dark mode the Record button is lime and the recording panel turns Marshmallow white.
            - The app now uses Geist and Geist Mono, bundled with the app.
            - A new sidebar: links grouped into Dictation, Words and Setup, counts next to History, Dictionary and Snippets, and a status line at the bottom that shows whether a model is ready. Ctrl+B (Cmd+B on a Mac) collapses it.
            - After a dictation lands, Home shows what was inserted, how much typing time it saved, and the odd word-count milestone.

            ### Faster transcription
            - Short Whisper clips are padded with silence instead of decoding a long window. On a laptop i5, a 13 s clip on Whisper Turbo dropped from about 12.6 s to 8-10 s, and Whisper Base from about 3 s to 2 s or less.
            - Streaming models finish about a third faster after you stop talking.
            - Live captions and wake words use fewer threads, and the caption model loads when the app starts.

            ### Update check
            - Settings has a "Check for updates" button, and the app tells you when a newer version is out. This is the only time the app goes online on its own, and you can turn it off.

            ### History
            - Search now covers every dictation you have saved, not just the latest ones.
            - Older dictations load in pages, and History opens much faster with a long history.
            - When you fix a word in History, the app offers to add it to your Dictionary.

            ### Hands-free and voice commands
            - Ordinary sentences no longer trigger commands, and if a command can't run, your words are typed instead of lost.
            - Editing commands are safer in terminals and other focused apps. "git push" and "git pull" are only typed, never run.
            - Speech detection no longer cuts off the start or end of what you said, and the Silero VAD model is actually used now.
            - Hands-free works with streaming models, survives the microphone disconnecting, and keeps the dock in step with the listener.
            - Setting it up in Settings is fixed: the wake-word download, phrase checks, and live sensitivity and timeout changes.

            ### Changed voice commands
            Some commands were renamed so everyday speech doesn't set them off:
            - `prompt <text>` is now `send prompt <text>`
            - `ask <text>` is now `ask claude|cursor|codex|chatgpt <text>`
            - `google <query>` is now `google for <query>`, and `search <query>` is now `search for <query>`
            - `uppercase <text>` is now `all caps <text>`
            - `snippet <name>` is now `insert snippet <name>` or `paste snippet <name>`
            - `open`, `focus` and `go to` only work for known apps. For other apps, say `switch to <app>` or `open app <app>`.

            ### Other fixes
            - Text cleanup no longer changes words you dictated.
            - Better audio capture and resampling, and long recordings are handled properly.
            - Transcripts and settings are no longer lost when the app closes or restarts.
            - Clearing history keeps your stats. Reset keeps onboarding and your Groq key.
            - Hold-to-talk is turned off on GNOME, where it can't work reliably.
            - Fixes to Settings, the mic test, model downloads and onboarding.
            - The main window now runs under a strict content security policy.

            ### Installers
            - Windows: `.msi` / `.exe` (NSIS) installers
            - macOS: universal `.dmg` (Apple Silicon + Intel)
            - Linux: `.deb` and `.AppImage`

            Models download inside the app on first run. Speech recognition always runs on your own machine.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
