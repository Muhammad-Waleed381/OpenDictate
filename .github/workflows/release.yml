name: Release

# Builds signed-free installers for all three platforms on version tags.
# Windows: NSIS .exe + MSI. macOS: universal .dmg/.app. Linux: .deb/.AppImage.
#
# Local cross-compilation is not possible (sherpa-onnx builds C++ per
# platform), so CI is the only place these artifacts are produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libpulse-dev libudev-dev libgtk-3-dev \
            pkg-config cmake build-essential

      - name: Install frontend dependencies
        run: npm ci

      # Optional GPU support: when the repo variable CUDA_LIBS_URL points at
      # a k2-fsa shared-lib archive containing GPU execution providers, the
      # standard installers link against it and gain CUDA capability (with
      # silent CPU fallback on machines without NVIDIA drivers). Unset =
      # classic static CPU build.
      - name: Download optional GPU libraries (Linux/Windows)
        if: ${{ matrix.platform != 'macos-latest' && vars.CUDA_LIBS_URL != '' }}
        run: |
          mkdir -p "$HOME/gpu-libs"
          curl -fL "${{ vars.CUDA_LIBS_URL }}" -o /tmp/libs.archive
          case /tmp/libs.archive in
            *.zip) unzip -q /tmp/libs.archive -d "$HOME/gpu-libs" ;;
            *) tar -xf /tmp/libs.archive -C "$HOME/gpu-libs" ;;
          esac
          echo "SHERPA_ONNX_LIB_DIR=$(find "$HOME/gpu-libs" -type f -name 'libsherpa-onnx-c-api*' | head -1 | xargs dirname)" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDictate ${{ github.ref_name }}"
          releaseBody: |
            OpenDictate — local-first voice dictation.

            - Windows: `.msi` / `.exe` (NSIS) installers
            - macOS: universal `.dmg` (Apple Silicon + Intel)
            - Linux: `.deb` and `.AppImage`

            Models download inside the app on first run; everything stays local.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ matrix.platform != 'macos-latest' && vars.CUDA_LIBS_URL != '' && '--features gpu-shared' || '' }}
