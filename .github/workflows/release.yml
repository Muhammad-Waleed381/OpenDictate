name: Release

# Builds signed-free installers for all three platforms on version tags.
# Windows: NSIS .exe + MSI. macOS: universal .dmg/.app. Linux: .deb/.AppImage.
#
# Local cross-compilation is not possible (sherpa-onnx builds C++ per
# platform), so CI is the only place these artifacts are produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libpulse-dev libudev-dev libgtk-3-dev \
            libfuse2 zsync pkg-config cmake build-essential
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "ARCH=x86_64" >> "$GITHUB_ENV"
          # Pre-cache AppRun with world-executable permissions (0755) to prevent
          # AppRun.wrapped permission errors in unprivileged sandboxes (Firejail, etc.)
          mkdir -p "$HOME/.cache/tauri"
          curl -fL "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" -o "$HOME/.cache/tauri/AppRun-x86_64"
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: "x86_64"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDictate ${{ github.ref_name }}"
          releaseBody: |
            OpenDictate ${{ github.ref_name }} is a reliability release from a full repository bug audit: 63 confirmed issues fixed across dictation sessions, audio capture, text processing, model management, and desktop integration.

            ### Dictation & Audio
            - Microphone tests now only measure audio: no transcription, actions, history entries, or polish calls.
            - Streaming and offline sessions no longer drop final audio, the start of long recordings, or handsfree onset audio.
            - Session operations are serialized; cancelling prevents stale results from being committed.
            - PulseAudio stop/setup can no longer hang the app, and capture failures no longer leave a phantom recording active.

            ### Text Insertion & Processing
            - Failed insertions never submit existing content, and clipboard failures are reported instead of silently succeeding.
            - Insert/Undo return focus to the previous application; new **Text fields** and **Shell (Bash, Zsh)** input targets.
            - Fixed dictionary hotword crashes, punctuation/casing corruption, over-eager annotation filtering, and truncated polish output.

            ### Models
            - Model removal is restricted to the models directory; installs stay busy through extraction and are deduplicated.
            - Download cancel/retry keeps ownership until cleanup completes and responds promptly.

            ### Desktop & Data
            - History export includes every row; CSV column order and word statistics are corrected.
            - AppImage autostart no longer stores a temporary mount path; macOS autostart plist is properly escaped.
            - GNOME hotkey and macOS shortcut replacement fixes; Local SLM (not yet implemented) can no longer be selected.

            ### Installers
            - Windows: `.msi` / `.exe` (NSIS) installers
            - macOS: universal `.dmg` (Apple Silicon + Intel)
            - Linux: `.deb` and `.AppImage`

            Models download inside the app on first run; everything stays local.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
