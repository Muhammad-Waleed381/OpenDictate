name: Release

# Builds signed-free installers for all three platforms on version tags.
# Windows: NSIS .exe + MSI. macOS: universal .dmg/.app. Linux: .deb/.AppImage.
#
# Local cross-compilation is not possible (sherpa-onnx builds C++ per
# platform), so CI is the only place these artifacts are produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libpulse-dev libudev-dev libgtk-3-dev \
            libfuse2 zsync pkg-config cmake build-essential
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "ARCH=x86_64" >> "$GITHUB_ENV"
          # Pre-cache AppRun with world-executable permissions (0755) to prevent
          # AppRun.wrapped permission errors in unprivileged sandboxes (Firejail, etc.)
          mkdir -p "$HOME/.cache/tauri"
          curl -fL "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" -o "$HOME/.cache/tauri/AppRun-x86_64"
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: "x86_64"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDictate ${{ github.ref_name }}"
          releaseBody: |
            OpenDictate ${{ github.ref_name }} brings critical Windows dock and overlay visibility fixes, clipboard paste reliability improvements, model downloading robustness, and Linux AppImage sandbox compatibility.

            ### Windows Dock & Overlay Enhancements
            - Taskbar Occlusion Fix: Screen positioning now respects monitor work areas rather than full screen bounds, keeping the floating mic overlay 16px above the Windows taskbar across all display scales (100% to 200% DPI).
            - Multi-Monitor Positioning: Corrected global coordinate offsets so the dock accurately positions on secondary and negative-offset monitors.
            - Corner Anchor Stability: Fixed idle button alignment so the mic pill stays securely anchored to the selected corner without shifting or jumping when speech detection starts or stops.
            - Window Restore on Minimize: System tray activation and second-instance launches now properly unminimize windows on Windows.
            - NVIDIA GPU Detection: Enhanced GPU provider discovery on Windows to check executable file extensions in PATH.

            ### Cross-Platform Injection & Model Reliability
            - Clipboard & Paste Injection: Fixed keyboard accelerator dispatch for Windows (avoiding virtual key code 0) and optimized clipboard settle timings.
            - Network & Download Robustness: Increased connect timeouts to 30s with atomic partial file downloads and immediate progress feedback.

            ### Linux AppImage Hardening
            - Sandbox Permissions: Enforced 0755 permissions on AppRun within packaged AppImages for compatibility with unprivileged sandboxes (e.g. Firejail).

            ### Installers
            - Windows: `.msi` / `.exe` (NSIS) installers
            - macOS: universal `.dmg` (Apple Silicon + Intel)
            - Linux: `.deb` and `.AppImage`

            Models download inside the app on first run; everything stays local.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
