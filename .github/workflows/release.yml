name: Release

# Builds signed-free installers for all three platforms on version tags.
# Windows: NSIS .exe + MSI. macOS: universal .dmg/.app. Linux: .deb/.AppImage.
#
# Local cross-compilation is not possible (sherpa-onnx builds C++ per
# platform), so CI is the only place these artifacts are produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libpulse-dev libudev-dev libgtk-3-dev \
            libfuse2 zsync pkg-config cmake build-essential
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "ARCH=x86_64" >> "$GITHUB_ENV"
          # Pre-cache AppRun with world-executable permissions (0755) to prevent
          # AppRun.wrapped permission errors in unprivileged sandboxes (Firejail, etc.)
          mkdir -p "$HOME/.cache/tauri"
          curl -fL "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" -o "$HOME/.cache/tauri/AppRun-x86_64"
          chmod 755 "$HOME/.cache/tauri/AppRun-x86_64"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: "x86_64"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDictate ${{ github.ref_name }}"
          releaseBody: |
            OpenDictate ${{ github.ref_name }} adds new 2025/2026 speech-to-text models (Meta Omnilingual ASR and Cohere Transcribe), company-based model filtering with branded SVG logos, and major performance optimizations for offline inference.

            ### New Speech-to-Text Engines
            - **Meta Omnilingual ASR 300M (int8)**: Breakthrough multilingual CTC model supporting over 1,600 languages with fast offline inference.
            - **Cohere Transcribe 2B (int8)**: State-of-the-art multilingual model with built-in punctuation and inverse text normalization (ITN).
            - Native engine decoders and automatic model downloading/extraction for both new model architectures.

            ### Model Management & Company Filtering
            - Company Filtering: Added filter controls to filter speech models by their creators (NVIDIA, OpenAI, Meta, Cohere).
            - Brand Logos: Integrated clean SVG logos for NVIDIA, OpenAI, Meta, and Cohere in filter buttons and model cards.
            - Search Expansion: Model search now indexes company names in addition to model IDs and names.

            ### Inference Performance & Optimization
            - CPU Topology Optimization: Automatically detects physical CPU cores (filtering out hyperthreaded SMT logical cores) to prevent cache thrashing in ONNX Runtime, scaling up to 32 threads.
            - Whisper Batch Decoding: Accelerated multi-chunk audio processing by parallelizing chunk decoding across concurrent ONNX streams.
            - Eager Warmup: Pre-warms the active model and Silero VAD in the background upon starting recording and app launch, eliminating cold-start latency when recording completes.
            - Thread Pool Sizing: Tuned streaming and wake-word thread allocations to eliminate synchronization overhead on small audio frames.

            ### Desktop & Focus Stability
            - Focus Watchdog: Prevented the floating dock HUD from stealing or capturing keyboard focus when switching spaces or workspaces.

            ### Installers
            - Windows: `.msi` / `.exe` (NSIS) installers
            - macOS: universal `.dmg` (Apple Silicon + Intel)
            - Linux: `.deb` and `.AppImage`

            Models download inside the app on first run; everything stays 100% local.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
