name: Release

# Builds signed-free installers for all three platforms on version tags.
# Windows: NSIS .exe + MSI. macOS: universal .dmg/.app. Linux: .deb/.AppImage.
#
# Local cross-compilation is not possible (sherpa-onnx builds C++ per
# platform), so CI is the only place these artifacts are produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libpulse-dev libudev-dev libgtk-3-dev \
            pkg-config cmake build-essential

      - name: Install frontend dependencies
        run: npm ci

      # Single dual-capable installer: Linux/Windows link against sherpa-onnx
      # shared libraries built with GPU execution providers. On NVIDIA
      # machines CUDA engages (Settings → GPU acceleration); everywhere else
      # engines silently run CPU. macOS keeps the static CPU build until a
      # CoreML-enabled archive is validated.
      - name: Download GPU-capable libraries (Linux)
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          curl -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-v1.13.4-cuda-12.x-cudnn-9.x-onnxruntime1.27.1-linux-x64-gpu.tar.bz2" -o /tmp/libs.tbz2
          mkdir -p "$HOME/gpu-libs" && tar -xf /tmp/libs.tbz2 -C "$HOME/gpu-libs"
          LIBDIR=$(find "$HOME/gpu-libs" -type f -name 'libsherpa-onnx-c-api.so' | head -1 | xargs dirname)
          echo "SHERPA_ONNX_LIB_DIR=$LIBDIR" >> "$GITHUB_ENV"
          # linuxdeploy resolves NEEDED chains with ldd: make the CUDA/cuDNN
          # libraries visible, and never strip a GPU-linked binary.
          echo "LD_LIBRARY_PATH=$LIBDIR:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          # The deb/rpm/appimage must SHIP the shared libraries and the binary
          # must find them: libs install to /usr/lib/opendictate via the files
          # map (key = destination, value = source), and build.rs bakes a
          # matching RUNPATH from this env var ($ORIGIN-relative + absolute).
          echo 'OPENDICTATE_LINUX_RPATH=$ORIGIN/../lib/opendictate:/usr/lib/opendictate' >> "$GITHUB_ENV"
          # tauri-cli cannot pass --no-default-features to cargo, so select
          # the shared link mode by flipping the manifest default instead.
          sed -i 's/^default = \["cpu-static"\]/default = ["gpu-shared"]/' crates/opendictate-core/Cargo.toml
          grep -n "^default" crates/opendictate-core/Cargo.toml
          SHERPA_ONNX_LIB_DIR="$LIBDIR" python3 scripts/inject-linux-libs.py

      - name: Download GPU-capable libraries (Windows)
        if: ${{ matrix.platform == 'windows-latest' }}
        shell: pwsh
        run: |
          # The CUDA archive carries runtime DLLs but no import libraries,
          # so we LINK against the CPU shared archive (identical C API) and
          # SHIP the CUDA DLLs as bundle resources — at runtime the loader
          # prefers the copies installed next to the exe.
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\gpu-link", "$env:USERPROFILE\gpu-runtime", "src-tauri\gpu-resources" | Out-Null

          curl.exe -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-v1.13.4-win-x64-shared-MT-Release-lib.tar.bz2" -o "$env:RUNNER_TEMP\cpu.zip"
          tar -xf "$env:RUNNER_TEMP\cpu.zip" -C "$env:USERPROFILE\gpu-link"
          $linkLib = Get-ChildItem -Recurse "$env:USERPROFILE\gpu-link" -Filter "onnxruntime.lib" | Select-Object -First 1
          if (-not $linkLib) { throw "onnxruntime.lib missing from CPU shared archive" }
          "SHERPA_ONNX_LIB_DIR=$($linkLib.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          curl.exe -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-v1.13.4-cuda-12.x-cudnn-9.x-win-x64-cuda.tar.bz2" -o "$env:RUNNER_TEMP\cuda.zip"
          tar -xf "$env:RUNNER_TEMP\cuda.zip" -C "$env:USERPROFILE\gpu-runtime"
          # DLLs must sit next to opendictate.exe at launch (the Windows
          # loader does not search subdirectories), so copy them flat into
          # src-tauri and declare them as root-level resources.
          Get-ChildItem -Recurse "$env:USERPROFILE\gpu-runtime" -Filter "*.dll" | Copy-Item -Destination "src-tauri"
          if (-not (Test-Path "src-tauri\onnxruntime_providers_cuda.dll")) { throw "CUDA provider dll missing from GPU archive" }

          $conf = Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json
          # bundle.resources may not exist yet; -Force creates or overwrites.
          $conf.bundle | Add-Member -NotePropertyName resources -NotePropertyValue @("*.dll") -Force
          $conf | ConvertTo-Json -Depth 32 | Set-Content "src-tauri\tauri.conf.json"

          $manifest = "crates/opendictate-core/Cargo.toml"
          (Get-Content $manifest) -replace '^default = \["cpu-static"\]', 'default = ["gpu-shared"]' | Set-Content $manifest

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDictate ${{ github.ref_name }}"
          releaseBody: |
            OpenDictate — local-first voice dictation.

            - Windows: `.msi` / `.exe` (NSIS) installers
            - macOS: universal `.dmg` (Apple Silicon + Intel)
            - Linux: `.deb` and `.AppImage`

            Models download inside the app on first run; everything stays local.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
